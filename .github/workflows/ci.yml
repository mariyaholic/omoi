name: Omoi verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Format
        run: cargo +${{ matrix.toolchain }} fmt --check
      - name: Lint
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - name: Windows desktop loader
        if: runner.os == 'Windows'
        run: python scripts/verify_desktop.py --bin-dir target/debug --stage-only
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets
      - name: Release build
        id: release_build
        run: cargo +${{ matrix.toolchain }} build --locked --release --bins --example synthetic
      - name: Synthetic release journey
        run: python scripts/smoke.py --bin-dir target/release
      - name: Desktop window
        if: runner.os == 'Windows'
        run: python scripts/verify_desktop.py --bin-dir target/release
      - name: Playback transport and restart
        run: python scripts/verify_playback.py --binary target/release/omoi${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Userscript capture semantics
        run: node --test tests/userscript.test.cjs
      - name: Capture bundle consistency
        run: python scripts/build_capture.py --check
      - name: Companion queue and worker lifecycle
        run: node --test tests/extension.test.cjs
      - name: Guided setup and native protocol journey
        run: python scripts/verify_setup.py --bin-dir target/release
      - name: Isolated native host registration lifecycle
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: python tests/host_registration.py
      - name: Unsigned installer compile
        id: installer_compile
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBinDir=$((Resolve-Path target/release).Path)" packaging/omoi.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Disposable Windows installer lifecycle
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.installer_compile.outcome == 'success' }}
        run: python scripts/verify_installer.py --installer dist/Omoi-Setup-unsigned.exe
      - name: Portable Windows package verification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: python scripts/package_windows.py --bin-dir target/release --out dist/Omoi-portable-unsigned.zip
      - name: Private unsigned review artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: omoi-windows-unsigned
          path: |
            dist/Omoi-Setup-unsigned.exe
            dist/Omoi-portable-unsigned.zip
          retention-days: 7
      - name: Scheduler absence and cleanup transitions
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: python tests/scheduler_state.py
      - name: Desktop profile cleanup transitions
        run: python tests/desktop_state.py
      - name: UI race test dependency
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: python -m pip install playwright==1.62.0
      - name: UI request ownership transitions
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: python tests/ui_state.py
